services:
  - type: web
    name: orbita-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: leadflow
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_URL
        value: https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent
      - key: CAL_BOOKING_A
        value: https://cal.com/priority-15min
      - key: CAL_BOOKING_B
        value: https://cal.com/cal-60-priority
      - key: BACKEND_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
